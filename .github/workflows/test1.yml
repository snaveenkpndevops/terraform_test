name: full working code

on:
  pull_request:
    paths:
      - '**/*.tf'

jobs:
  check-changed-files:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetch enough history for comparison

      # Step 2: Find changed Terraform files
      - name: Find changed .tf files
        id: changed-files
        run: |
          echo "Checking for changed .tf files..."
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main | grep '\.tf$' || true)
          echo "Changed files: $CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Terraform files changed."
            exit 0
          else
            echo "Terraform files changed:" > changed_files.txt
            echo "$CHANGED_FILES" | tee -a changed_files.txt
            echo "::set-output name=files::$CHANGED_FILES"
          fi

      # Step 3: Set up Python (required for Checkov)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 4: Install Checkov
      - name: Install Checkov
        run: pip install checkov

      # Step 5: Install Terraform
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      # Step 6: Install TFLint
      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      # Step 7: Run Terraform fmt on changed files and save output
      - name: Run Terraform fmt
        if: success() && steps.changed-files.outputs.files != ''
        run: |
          echo "Terraform fmt results:" > terraform_fmt.txt
          for file in ${{ steps.changed-files.outputs.files }}; do
            echo "Checking $file" >> terraform_fmt.txt
            terraform fmt -check -diff $file >> terraform_fmt.txt 2>&1 || echo "WARNING: Terraform fmt failed for $file" >> terraform_fmt.txt
          done

      # Step 8: Run TFLint on changed files and save output
      - name: Run TFLint
        if: success() && steps.changed-files.outputs.files != ''
        run: |
          echo "TFLint results:" > tflint_results.txt
          for file in ${{ steps.changed-files.outputs.files }}; do
            echo "Checking $file" >> tflint_results.txt
            tflint $file >> tflint_results.txt 2>&1 || echo "WARNING: TFLint issues found in $file" >> tflint_results.txt
          done

      # Step 9: Run Checkov scan on changed .tf files and save results
      - name: Run Checkov
        if: success() && steps.changed-files.outputs.files != ''
        run: |
          echo "Checkov results:" > checkov_results.txt
          for file in ${{ steps.changed-files.outputs.files }}; do
            echo "Scanning $file" >> checkov_results.txt
            checkov -f $file --output cli >> checkov_results.txt 2>&1 || echo "Checkov issues found in $file" >> checkov_results.txt
          done

      # Step 10: Upload results as artifacts
      - name: Upload scan results as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: terraform-scan-results
          path: |
            terraform_fmt.txt
            tflint_results.txt
            checkov_results.txt
          retention-days: 7

  post-results:
    runs-on: ubuntu-latest
    needs: check-changed-files

    steps:
      # Step 1: Download artifacts
      - name: Download Terraform scan results artifact
        uses: actions/download-artifact@v3
        with:
          name: terraform-scan-results

      # Step 2: Post Checkov scan results as PR comment
      - name: Post Checkov scan results as PR comment
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --json number --state open --limit 1 | jq --raw-output '.[0].number')
          echo "## Terraform Security Scan Results 🚀" > pr_comment.txt
          echo "### Terraform fmt Results:" >> pr_comment.txt
          cat terraform_fmt.txt >> pr_comment.txt
          echo "### TFLint Results:" >> pr_comment.txt
          cat tflint_results.txt >> pr_comment.txt
          echo "### Checkov Results:" >> pr_comment.txt
          cat checkov_results.txt >> pr_comment.txt
          gh pr comment $PR_NUMBER --body-file pr_comment.txt

      # Step 3: Post success message in PR comment
      - name: Post success message
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --json number --state open --limit 1 | jq --raw-output '.[0].number')
          echo "✅ All security checks passed successfully! 🎉" | gh pr comment $PR_NUMBER --body-file -
 